<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      let theme = 'system';
      try { theme = localStorage.getItem('specmaker.theme') || 'system'; } catch {}
      document.documentElement.classList.toggle('dark', theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
    </script>
    <title>VA Spec Maker</title>
    <meta name="description" content="Редактор спецификаций голосовых ассистентов: интенты, сущности, промпты и сценарии с экспортом в DOCX и Markdown." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
